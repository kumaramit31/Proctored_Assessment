# Server port is arbitrary
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/critter?useSSL=false&serverTimezone=UTC&allowPublicKeyretrieval=true
spring.jpa.defer-datasource-initialization=true
spring.h2.console.settings.web-allow-others=true
spring.datasource.username=root
spring.datasource.password=Sqlpassword@1
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# Data Source Setup
# Note: Users must create a H2 db that they will reference here, create a user that has access to it on localhost
#       and provide the credentials below to access it

